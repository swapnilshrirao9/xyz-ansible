---
- name: Install Python 3 on Alpine Linux
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Update Alpine package index
      ansible.builtin.command:
        cmd: apk update

    - name: Install Python 3
      ansible.builtin.apk:
        name:
          - python3
        state: present
        update_cache: false

    - name: Verify Python 3 installation
      ansible.builtin.command:
        cmd: python3 --version
      register: python_version
      changed_when: false

    - name: Display Python version
      ansible.builtin.debug:
        msg: "{{ python_version.stdout }}"